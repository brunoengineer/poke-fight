<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Pixelify+Sans:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="screen" data-testid="screen" aria-label="Fight screen"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
